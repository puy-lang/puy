# cargo-deny configuration, checked by the `deny` CI job.
# License policy: docs/requirements.md §2.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Only permissive licenses compatible with an MIT-licensed project are allowed.
# Crates under licenses not listed here (GPL, LGPL, ...) are not added.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace are allowed
allow-wildcard-paths = true
deny = [
    # No dependency on OpenSSL. TLS uses rustls (requirements §8.1)
    { crate = "openssl", reason = "TLS uses rustls (requirements §8.1)" },
    { crate = "openssl-sys", reason = "TLS uses rustls (requirements §8.1)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
