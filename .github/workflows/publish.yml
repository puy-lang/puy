# Publishes the crates to crates.io when a release tag (v<version>) is pushed.
# Each release commit is built and tested before it is exported to this repository,
# so this workflow does not run the test suite again.
#
# There is one job per crate, chained with `needs` in dependency order, so that a
# failure partway (a rate limit, a network error) is resumed with "Re-run failed
# jobs": the crates already published keep their successful jobs and are not
# uploaded again. The job id is the crate name, and `needs` lists the jobs of the
# crate's dependencies; scripts/export-public.py checks both against the workspace.
#
# Requires the repository secret CARGO_REGISTRY_TOKEN (a crates.io API token with the
# publish-new and publish-update scopes).
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Check that the tag matches the workspace version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "puy-core"))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  puy-host:
    needs: [version]
    uses: ./.github/workflows/publish-crate.yml
    with: {crate: puy-host}
    secrets: inherit

  puy-core:
    needs: [puy-host]
    uses: ./.github/workflows/publish-crate.yml
    with: {crate: puy-core}
    secrets: inherit

  puy-fmt:
    needs: [puy-core]
    uses: ./.github/workflows/publish-crate.yml
    with: {crate: puy-fmt}
    secrets: inherit

  puy-runtime-native:
    needs: [puy-core, puy-host]
    uses: ./.github/workflows/publish-crate.yml
    with: {crate: puy-runtime-native}
    secrets: inherit

  puy-runtime-web:
    needs: [puy-core, puy-host]
    uses: ./.github/workflows/publish-crate.yml
    with: {crate: puy-runtime-web}
    secrets: inherit

  puy-runtime-wasi:
    needs: [puy-core, puy-host, puy-runtime-native]
    uses: ./.github/workflows/publish-crate.yml
    with: {crate: puy-runtime-wasi}
    secrets: inherit

  puy:
    needs: [puy-core, puy-fmt, puy-host, puy-runtime-native, puy-runtime-wasi]
    uses: ./.github/workflows/publish-crate.yml
    with: {crate: puy}
    secrets: inherit
