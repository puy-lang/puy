# Publishes the crates to crates.io when a release tag (v<version>) is pushed.
# Each release commit is built and tested before it is exported to this repository,
# so this workflow does not run the test suite again.
#
# Requires the repository secret CARGO_REGISTRY_TOKEN (a crates.io API token with the
# publish-new and publish-update scopes).
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Check that the tag matches the workspace version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "puy-core"))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
      # Publishes every crate except those with `publish = false`, in dependency order.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
