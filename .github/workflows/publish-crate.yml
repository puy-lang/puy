# Publishes one crate to crates.io. Called by publish.yml, one job per crate.
name: Publish a crate

on:
  workflow_call:
    inputs:
      crate:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # Waits until the crate is available in the index, so the jobs that need this
      # one can resolve it.
      - run: cargo publish --package "$CRATE" --locked
        env:
          CRATE: ${{ inputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
