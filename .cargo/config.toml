# Windows binaries link the MSVC C runtime (CRT) statically (requirements §9.5;
# docs/design/platform-notes.md chapter 5). With the default dynamic linking they would not
# start where vcruntime140.dll (the VC++ redistributable) is missing; this way they depend only
# on DLLs shipped with the OS. CI and local builds use the same setting, so they test the same
# form as the release binaries.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Enlarge the wasm32 stack (1MB by default). A chain of `if` at the nesting limit of 256
# (`docs/spec/grammar.md` chapter 3) needs more than 2MB in a debug build, so use the same size as
# the native `puy` (a 16MB thread) and the `puy-testsuite` runner
# (`docs/design/compiler-pipeline.md` 3.11).
[target.wasm32-wasip2]
rustflags = ["-C", "link-arg=-zstack-size=16777216"]

[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=16777216"]

# Fix where the machine code of the VM lands (docs/design/vm.md 3.14): on native targets, start
# every function at a 64-byte boundary and every block that is only entered by a jump (the arms
# of the dispatch `match` in `Isolate::run_loop`) at a 16-byte boundary. Without this, the speed
# of `run_loop` changed by 5-20% with where its code landed, even with the same machine code,
# which hid the effect of changes to the VM in the benchmarks (docs/notes/benchmark-m4c.md,
# M4-66). The text grows by about 7.5%; a 32-byte boundary for the blocks grew it by 15% and the
# peak resident set size of `uses System.Generics.Collections` past 10MB.
[target.'cfg(not(target_family = "wasm"))']
rustflags = ["-C", "llvm-args=-align-all-functions=6", "-C", "llvm-args=-align-all-nofallthru-blocks=4"]
